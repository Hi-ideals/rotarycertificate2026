version: '3.8'
services:
  db:
    image: mysql:5.6
    container_name: testrotarycertificatedb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysql123
      MYSQL_DATABASE: db_rotary
      MYSQL_USER: rotary
      MYSQL_PASSWORD: Rotary@HitpL2026
    ports:
      - "3317:3306" 
    volumes:
      - ./rotary.sql:/docker-entrypoint-initdb.d/rotary.sql
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    networks:
      - rotarycertificate26-network-certificate
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -pmysql123 -e 'SELECT 1'"]
      interval: 10s     
      retries: 10
      start_period: 40s

  tomcat:
    build:
      context: .  
    image: rotarycertificate:latest
    container_name: rotarycertificateapp 
    restart: always
    depends_on:
      db:
        condition: service_healthy  
    networks:
      - rotarycertificate26-network-certificate
    ports:
      - "9317:8080"
    mem_limit: 512m
    environment:
      MYSQL_HOST: db    
      MYSQL_PORT: 3306
      MYSQL_DB: db_rotary
      MYSQL_USER: rotary
      MYSQL_PASSWORD: Rotary@HitpL2026  

networks:
  rotarycertificate26-network-certificate:
    driver: bridge  
